<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Courier Matcher</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f4ed;
        --panel: #fffdf8;
        --ink: #20201d;
        --muted: #6d6a61;
        --line: #dad3c3;
        --line-strong: #bdb39e;
        --amber: #d98f24;
        --amber-soft: #f5d59b;
        --green: #1f7a55;
        --green-soft: #d7eadc;
        --red: #b94432;
        --red-soft: #f4d8d1;
        --blue: #245f73;
        --blue-soft: #d5e8ec;
        --shadow: 0 18px 48px rgba(54, 42, 22, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(90deg, rgba(32, 32, 29, 0.035) 1px, transparent 1px),
          linear-gradient(rgba(32, 32, 29, 0.025) 1px, transparent 1px),
          var(--paper);
        background-size: 28px 28px;
        color: var(--ink);
        font-family: Aptos, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto auto 1fr;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(240px, 1fr) auto;
        gap: 20px;
        align-items: center;
        padding: 18px 24px;
        background: rgba(247, 244, 237, 0.92);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        font-family: Bahnschrift, Aptos, sans-serif;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-family: Bahnschrift, Aptos, sans-serif;
        font-size: clamp(22px, 2.6vw, 34px);
        line-height: 1;
      }

      .subtitle {
        margin-top: 5px;
        color: var(--muted);
        font-size: 13px;
      }

      .header-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .btn {
        min-height: 38px;
        border: 1px solid var(--ink);
        border-radius: 7px;
        background: var(--panel);
        color: var(--ink);
        padding: 8px 12px;
        font-weight: 750;
        transition:
          transform 140ms ease,
          box-shadow 140ms ease,
          background 140ms ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(32, 32, 29, 0.12);
      }

      .btn.primary {
        background: var(--ink);
        color: var(--paper);
      }

      .btn.quiet {
        border-color: var(--line-strong);
        color: var(--muted);
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(220px, 1.2fr) repeat(
            4,
            minmax(130px, 0.55fr)
          );
        gap: 12px;
        padding: 16px 24px;
        background: rgba(255, 253, 248, 0.72);
        border-bottom: 1px solid var(--line);
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: var(--panel);
        color: var(--ink);
        padding: 8px 10px;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--ink);
        box-shadow: 0 0 0 3px rgba(217, 143, 36, 0.22);
      }

      .range-row {
        display: grid;
        grid-template-columns: 1fr 44px;
        align-items: center;
        gap: 8px;
      }

      input[type="range"] {
        min-height: 40px;
        padding: 0;
        accent-color: var(--amber);
      }

      .workspace {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: 0;
      }

      .rail {
        position: sticky;
        top: 138px;
        align-self: start;
        max-height: calc(100vh - 138px);
        overflow: auto;
        padding: 20px 18px 28px 24px;
        border-right: 1px solid var(--line);
      }

      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
      }

      .stat strong {
        display: block;
        font-family: Bahnschrift, Aptos, sans-serif;
        font-size: 26px;
        line-height: 1;
      }

      .stat span {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .progress {
        height: 12px;
        margin: 16px 0 20px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--panel);
      }

      .progress span {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--green), var(--amber));
        transition: width 200ms ease;
      }

      .rail-section {
        margin-top: 18px;
      }

      .province-list,
      .selected-list {
        display: grid;
        gap: 8px;
      }

      .province-pill,
      .selected-pill {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(255, 253, 248, 0.72);
        padding: 8px 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .list-wrap {
        min-width: 0;
        padding: 20px 24px 42px;
      }

      .list-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 13px;
      }

      .city-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 14px;
      }

      .city-card {
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.94);
        box-shadow: 0 8px 22px rgba(32, 32, 29, 0.06);
        overflow: hidden;
      }

      .city-card.is-selected {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(31, 122, 85, 0.14);
      }

      .city-card.is-merge {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(36, 95, 115, 0.14);
      }

      .city-card.is-skipped {
        border-color: var(--red);
      }

      .city-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .city-name {
        margin: 0;
        font-family: Bahnschrift, Aptos, sans-serif;
        font-size: 18px;
        line-height: 1.15;
      }

      .city-id {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .score-badge {
        min-width: 68px;
        align-self: start;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: var(--paper);
        padding: 8px;
        text-align: center;
      }

      .score-badge strong {
        display: block;
        font-family: Bahnschrift, Aptos, sans-serif;
        font-size: 21px;
        line-height: 1;
      }

      .score-badge span {
        color: var(--muted);
        font-size: 11px;
      }

      .selected-strip {
        display: none;
        margin: 0 14px 12px;
        border: 1px solid var(--green);
        border-radius: 7px;
        background: var(--green-soft);
        padding: 10px;
        font-size: 13px;
      }

      .city-card.is-selected .selected-strip {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .city-card.is-merge .selected-strip {
        border-color: var(--blue);
        background: var(--blue-soft);
      }

      .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 14px 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .section-label .btn {
        min-height: 30px;
        padding: 5px 8px;
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
      }

      .candidate-list {
        display: grid;
        gap: 8px;
        padding: 0 14px 14px;
      }

      .candidate {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 72px auto;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fffaf0;
        padding: 10px;
      }

      .candidate.is-picked {
        border-color: var(--green);
        background: var(--green-soft);
      }

      .candidate.db-target {
        background: #f6fbfc;
      }

      .candidate.is-merge-picked {
        border-color: var(--blue);
        background: var(--blue-soft);
      }

      .candidate-main {
        min-width: 0;
      }

      .candidate-title {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-weight: 850;
      }

      .candidate-title span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 6px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        padding: 3px 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
      }

      .chip.tcs {
        color: #6f4d10;
        background: var(--amber-soft);
        border-color: #e2b866;
      }

      .chip.leopards {
        color: #6b3428;
        background: var(--red-soft);
        border-color: #dfa99d;
      }

      .chip.daewoo {
        color: #154f61;
        background: var(--blue-soft);
        border-color: #9ccbd5;
      }

      .chip.merge {
        color: #154f61;
        background: var(--blue-soft);
        border-color: #9ccbd5;
      }

      .chip.mapped {
        color: #1f5e43;
        background: var(--green-soft);
        border-color: #9cccb2;
      }

      .chip.unmapped {
        color: #7a4a0f;
        background: var(--amber-soft);
        border-color: #e2b866;
      }

      .candidate-score {
        display: grid;
        gap: 5px;
        text-align: right;
      }

      .bar {
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: #e9e1d1;
      }

      .bar span {
        display: block;
        height: 100%;
        background: var(--amber);
      }

      .mini {
        color: var(--muted);
        font-size: 11px;
      }

      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 14px 14px;
      }

      .empty {
        border: 1px dashed var(--line-strong);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.78);
        padding: 26px;
        text-align: center;
        color: var(--muted);
      }

      .drawer {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        background: rgba(32, 32, 29, 0.34);
      }

      .drawer.is-open {
        display: grid;
        place-items: stretch end;
      }

      .drawer-panel {
        width: min(720px, 100vw);
        height: 100vh;
        overflow: auto;
        background: var(--paper);
        border-left: 1px solid var(--ink);
        box-shadow: var(--shadow);
      }

      .drawer-head {
        position: sticky;
        top: 0;
        z-index: 1;
        display: grid;
        gap: 12px;
        padding: 18px;
        background: rgba(247, 244, 237, 0.96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }

      .drawer-title {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 12px;
      }

      .drawer-list {
        display: grid;
        gap: 8px;
        padding: 16px 18px 28px;
      }

      .csv-panel {
        position: fixed;
        inset: auto 24px 24px auto;
        z-index: 35;
        display: none;
        width: min(620px, calc(100vw - 48px));
        border: 1px solid var(--ink);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .csv-panel.is-open {
        display: block;
      }

      .csv-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      .csv-panel textarea {
        min-height: 260px;
        border: 0;
        border-radius: 0 0 8px 8px;
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 12px;
        resize: vertical;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        z-index: 50;
        translate: -50% 16px;
        opacity: 0;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        padding: 10px 14px;
        transition:
          opacity 180ms ease,
          translate 180ms ease;
      }

      .toast.is-visible {
        translate: -50% 0;
        opacity: 1;
      }

      @media (max-width: 1080px) {
        .controls {
          grid-template-columns: 1fr 1fr;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .rail {
          position: static;
          max-height: none;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding-right: 24px;
        }
      }

      @media (max-width: 720px) {
        .topbar {
          grid-template-columns: 1fr;
        }

        .header-actions {
          justify-content: stretch;
        }

        .header-actions .btn {
          flex: 1;
        }

        .controls {
          grid-template-columns: 1fr;
        }

        .city-list {
          grid-template-columns: 1fr;
        }

        .candidate {
          grid-template-columns: 1fr;
        }

        .candidate-score {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="mark">CM</div>
          <div>
            <h1>City Matcher</h1>
            <div class="subtitle" id="libraryStatus">
              fastest-levenshtein scoring
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn quiet" id="copyCsvBtn" type="button">
            Copy CSV
          </button>
          <button class="btn" id="showCsvBtn" type="button">Preview CSV</button>
          <button class="btn primary" id="downloadCsvBtn" type="button">
            Download CSV
          </button>
        </div>
      </header>

      <section class="controls" aria-label="Matcher controls">
        <div class="field">
          <label for="searchInput">Search</label>
          <input
            id="searchInput"
            type="search"
            placeholder="City, province, alias, candidate"
          />
        </div>
        <div class="field">
          <label for="statusFilter">Status</label>
          <select id="statusFilter">
            <option value="all">All cities</option>
            <option value="open">Open</option>
            <option value="selected">Selected</option>
            <option value="skipped">No match</option>
            <option value="strong">Best score 60+</option>
            <option value="weak">Best score under 45</option>
          </select>
        </div>
        <div class="field">
          <label for="providerFilter">Courier</label>
          <select id="providerFilter">
            <option value="all">Any courier</option>
            <option value="tcs">TCS</option>
            <option value="leopards">Leopards</option>
            <option value="daewoo">Daewoo</option>
          </select>
        </div>
        <div class="field">
          <label for="sortSelect">Sort</label>
          <select id="sortSelect">
            <option value="best">Best score</option>
            <option value="name">City name</option>
            <option value="province">Province</option>
            <option value="selected">Selected first</option>
          </select>
        </div>
        <div class="field">
          <label for="minScore">Minimum</label>
          <div class="range-row">
            <input id="minScore" type="range" min="0" max="100" value="0" />
            <strong id="minScoreLabel">0</strong>
          </div>
        </div>
      </section>

      <main class="workspace">
        <aside class="rail">
          <div class="stat-grid">
            <div class="stat">
              <strong id="totalCities">0</strong>
              <span>DB cities</span>
            </div>
            <div class="stat">
              <strong id="sourceCount">0</strong>
              <span>sources/db</span>
            </div>
            <div class="stat">
              <strong id="selectedCount">0</strong>
              <span>selected</span>
            </div>
            <div class="stat">
              <strong id="openCount">0</strong>
              <span>open</span>
            </div>
          </div>
          <div class="progress"><span id="progressBar"></span></div>

          <div class="rail-section">
            <label>Provinces</label>
            <div class="province-list" id="provinceList"></div>
          </div>

          <div class="rail-section">
            <label>Recent Picks</label>
            <div class="selected-list" id="recentList"></div>
          </div>
        </aside>

        <section class="list-wrap">
          <div class="list-meta">
            <span id="resultCount">0 visible</span>
            <button class="btn quiet" id="resetBtn" type="button">
              Reset saved picks
            </button>
          </div>
          <div class="city-list" id="cityList"></div>
        </section>
      </main>
    </div>

    <section class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-panel">
        <div class="drawer-head">
          <div class="drawer-title">
            <div>
              <h2 class="city-name" id="drawerCity">City</h2>
              <div class="city-id" id="drawerMeta"></div>
            </div>
            <button class="btn quiet" id="closeDrawerBtn" type="button">
              Close
            </button>
          </div>
          <input id="drawerSearch" type="search" placeholder="Search" />
        </div>
        <div class="drawer-list" id="drawerList"></div>
      </div>
    </section>

    <section class="csv-panel" id="csvPanel">
      <div class="csv-head">
        <strong>matches.csv + existing_db_city_id</strong>
        <button class="btn quiet" id="closeCsvBtn" type="button">Close</button>
      </div>
      <textarea id="csvOutput" spellcheck="false"></textarea>
    </section>

    <div class="toast" id="toast"></div>

    <script src="./prisma/data/manual-match-data.js"></script>
    <script>
      const data = window.MANUAL_MATCH_DATA;
      const STORAGE_KEY = "manual-city-matches-v1";
      const state = {
        search: "",
        status: "all",
        provider: "all",
        sort: "best",
        minScore: 0,
        drawerCityId: null,
        drawerMode: "source",
        drawerSearch: "",
        selections: {},
        skipped: {},
      };

      const els = {
        libraryStatus: document.getElementById("libraryStatus"),
        totalCities: document.getElementById("totalCities"),
        sourceCount: document.getElementById("sourceCount"),
        selectedCount: document.getElementById("selectedCount"),
        openCount: document.getElementById("openCount"),
        progressBar: document.getElementById("progressBar"),
        provinceList: document.getElementById("provinceList"),
        recentList: document.getElementById("recentList"),
        resultCount: document.getElementById("resultCount"),
        cityList: document.getElementById("cityList"),
        searchInput: document.getElementById("searchInput"),
        statusFilter: document.getElementById("statusFilter"),
        providerFilter: document.getElementById("providerFilter"),
        sortSelect: document.getElementById("sortSelect"),
        minScore: document.getElementById("minScore"),
        minScoreLabel: document.getElementById("minScoreLabel"),
        resetBtn: document.getElementById("resetBtn"),
        drawer: document.getElementById("drawer"),
        drawerCity: document.getElementById("drawerCity"),
        drawerMeta: document.getElementById("drawerMeta"),
        drawerSearch: document.getElementById("drawerSearch"),
        drawerList: document.getElementById("drawerList"),
        closeDrawerBtn: document.getElementById("closeDrawerBtn"),
        csvPanel: document.getElementById("csvPanel"),
        csvOutput: document.getElementById("csvOutput"),
        showCsvBtn: document.getElementById("showCsvBtn"),
        closeCsvBtn: document.getElementById("closeCsvBtn"),
        copyCsvBtn: document.getElementById("copyCsvBtn"),
        downloadCsvBtn: document.getElementById("downloadCsvBtn"),
        toast: document.getElementById("toast"),
      };

      let distanceFn = fallbackDistance;

      import("https://esm.sh/fastest-levenshtein@1.0.16")
        .then((mod) => {
          if (typeof mod.distance === "function") {
            distanceFn = mod.distance;
            els.libraryStatus.textContent = "fastest-levenshtein loaded";
          }
        })
        .catch(() => {
          els.libraryStatus.textContent = "fastest-levenshtein precomputed";
        });

      function loadSaved() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          state.selections = Object.fromEntries(
            Object.entries(saved.selections || {}).map(
              ([cityId, selection]) => [
                cityId,
                selection.type ? selection : { ...selection, type: "source" },
              ],
            ),
          );
          state.skipped = saved.skipped || {};
        } catch {
          state.selections = {};
          state.skipped = {};
        }
      }

      function persist() {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            selections: state.selections,
            skipped: state.skipped,
          }),
        );
      }

      function clean(value) {
        return String(value || "")
          .replace(/[\r\n]/g, "")
          .trim();
      }

      function normalize(value) {
        let out = clean(value).toLowerCase();
        out = out.replace(
          /\b([a-z])\.([a-z])\.?([a-z])?\.?([a-z])?\.?([a-z])?\b/g,
          (_, a, b, c, d, e) => [a, b, c, d, e].filter(Boolean).join(""),
        );
        out = out.replace(
          /\b([a-z])(?:-|\/|\s)?(\d{1,2})(?:[-/](\d{1,2}))?\b/gi,
          (match, letter, num, sub) => {
            const joined = /^[a-z]\d/i.test(match);
            const punctuated = /^[a-z][-/]/i.test(match);
            if (!joined && !punctuated) return match;
            const base = `${letter.toLowerCase()}${num}`;
            return sub ? `${base}_${sub}` : base;
          },
        );
        out = out.replace(/[^\p{L}\p{N}\s_]/gu, " ");
        out = out.replace(/\s+/g, " ").trim();
        out = out
          .replace(/\b(e|ul|al|i|wal|wala)\b/g, "")
          .replace(/\s+/g, " ")
          .trim();
        return out;
      }

      function tokenize(value) {
        return normalize(value).split(" ").filter(Boolean);
      }

      function fallbackDistance(a, b) {
        if (a === b) return 0;
        if (!a) return b.length;
        if (!b) return a.length;
        const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
        const curr = new Array(b.length + 1);
        for (let i = 1; i <= a.length; i++) {
          curr[0] = i;
          for (let j = 1; j <= b.length; j++) {
            curr[j] = Math.min(
              curr[j - 1] + 1,
              prev[j] + 1,
              prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
            );
          }
          for (let j = 0; j <= b.length; j++) prev[j] = curr[j];
        }
        return prev[b.length];
      }

      function levScore(a, b) {
        if (!a && !b) return 1;
        if (!a || !b) return 0;
        return 1 - distanceFn(a, b) / Math.max(a.length, b.length);
      }

      function tokenOverlap(aTokens, bTokens) {
        if (!aTokens.length || !bTokens.length) return 0;
        const a = new Set(aTokens);
        const b = new Set(bTokens);
        let shared = 0;
        a.forEach((token) => {
          if (b.has(token)) shared += 1;
        });
        return shared / Math.max(a.size, b.size);
      }

      function prefixScore(a, b) {
        if (!a || !b) return 0;
        if (a.startsWith(b) || b.startsWith(a)) return 1;
        return a.split(" ")[0] === b.split(" ")[0] ? 0.45 : 0;
      }

      function initialScore(aTokens, bTokens) {
        const a = aTokens.map((token) => token[0]).join("");
        const b = bTokens.map((token) => token[0]).join("");
        return a && b ? levScore(a, b) : 0;
      }

      function confidence(score) {
        if (score >= 78) return "high";
        if (score >= 62) return "medium";
        if (score >= 46) return "low";
        return "review";
      }

      function csvConfidence(score) {
        if (score >= 78) return "high";
        if (score >= 62) return "medium";
        return "low";
      }

      function scoreSource(city, source) {
        const names = [city.name, ...(city.aliases || [])].filter(Boolean);
        let best = null;
        names.forEach((name) => {
          const cityNorm = normalize(name);
          const sourceNorm = normalize(source.sourceName);
          const cityTokens = tokenize(name);
          const sourceTokens = tokenize(source.sourceName);
          const lev = levScore(cityNorm, sourceNorm);
          const tok = tokenOverlap(cityTokens, sourceTokens);
          const pre = prefixScore(cityNorm, sourceNorm);
          const init = initialScore(cityTokens, sourceTokens);
          const shortPenalty =
            Math.min(cityNorm.length, sourceNorm.length) <= 4 && lev < 0.75
              ? 0.08
              : 0;
          const composite = Math.max(
            0,
            Math.min(
              1,
              lev * 0.72 + tok * 0.18 + pre * 0.07 + init * 0.03 - shortPenalty,
            ),
          );
          const candidate = {
            ...source,
            score: Math.round(composite * 1000) / 10,
            levScore: Math.round(lev * 1000) / 10,
            tokenScore: Math.round(tok * 1000) / 10,
            distance: distanceFn(cityNorm, sourceNorm),
            matchedAgainst: name,
            confidence: confidence(Math.round(composite * 1000) / 10),
            tags: [
              tok > 0 ? `${Math.round(tok * 100)}% token overlap` : "",
              pre >= 1 ? "prefix match" : pre > 0 ? "same first token" : "",
              init >= 0.8 && cityTokens.length > 1 && sourceTokens.length > 1
                ? "initials close"
                : "",
              name !== city.name ? `alias: ${name}` : "",
            ].filter(Boolean),
          };
          if (!best || candidate.score > best.score) best = candidate;
        });
        return best;
      }

      function scoreDbTarget(city, target) {
        const cityNames = [city.name, ...(city.aliases || [])].filter(Boolean);
        const targetNames = [target.name, ...(target.aliases || [])].filter(
          Boolean,
        );
        let best = null;
        cityNames.forEach((cityName) => {
          targetNames.forEach((targetName) => {
            const cityNorm = normalize(cityName);
            const targetNorm = normalize(targetName);
            const cityTokens = tokenize(cityName);
            const targetTokens = tokenize(targetName);
            const lev = levScore(cityNorm, targetNorm);
            const tok = tokenOverlap(cityTokens, targetTokens);
            const pre = prefixScore(cityNorm, targetNorm);
            const init = initialScore(cityTokens, targetTokens);
            const shortPenalty =
              Math.min(cityNorm.length, targetNorm.length) <= 4 && lev < 0.75
                ? 0.08
                : 0;
            const composite = Math.max(
              0,
              Math.min(
                1,
                lev * 0.72 +
                  tok * 0.18 +
                  pre * 0.07 +
                  init * 0.03 -
                  shortPenalty,
              ),
            );
            const candidate = {
              ...target,
              score: Math.round(composite * 1000) / 10,
              levScore: Math.round(lev * 1000) / 10,
              tokenScore: Math.round(tok * 1000) / 10,
              distance: distanceFn(cityNorm, targetNorm),
              matchedAgainst: cityName,
              targetMatchedAgainst: targetName,
              confidence: confidence(Math.round(composite * 1000) / 10),
              tags: [
                tok > 0 ? `${Math.round(tok * 100)}% token overlap` : "",
                pre >= 1 ? "prefix match" : pre > 0 ? "same first token" : "",
                init >= 0.8 && cityTokens.length > 1 && targetTokens.length > 1
                  ? "initials close"
                  : "",
                cityName !== city.name ? `alias: ${cityName}` : "",
                targetName !== target.name ? `target alias: ${targetName}` : "",
              ].filter(Boolean),
            };
            if (!best || candidate.score > best.score) best = candidate;
          });
        });
        return best;
      }

      function providerText(providers) {
        const bits = [];
        if (providers.tcs)
          bits.push(
            `TCS ${providers.tcs.code || providers.tcs.id}${providers.tcs.area ? `/${providers.tcs.area}` : ""}`,
          );
        if (providers.leopards) bits.push(`Leopards ${providers.leopards.id}`);
        if (providers.daewoo) bits.push(`Daewoo ${providers.daewoo.id}`);
        return bits.join(" - ") || "No courier payload";
      }

      function providerChips(providers) {
        return [
          providers.tcs
            ? `<span class="chip tcs">TCS ${escapeHtml(providers.tcs.area || providers.tcs.code || "")}</span>`
            : "",
          providers.leopards
            ? `<span class="chip leopards">Leopards</span>`
            : "",
          providers.daewoo ? `<span class="chip daewoo">Daewoo</span>` : "",
        ].join("");
      }

      function dbTargetText(target) {
        return `${target.id} - ${target.province || "Unknown"}${target.aliases?.length ? ` - aliases: ${target.aliases.join(", ")}` : ""}`;
      }

      function dbTargetChips(target) {
        return `
          <span class="chip merge">DB city</span>
          <span class="chip ${target.hasCourierMappings ? "mapped" : "unmapped"}">
            ${target.hasCourierMappings ? "has mappings" : "no mappings"}
          </span>
        `;
      }

      function selectionLabel(selection) {
        if (!selection) return "";
        if (selection.type === "merge") {
          return `Merge into ${selection.targetName}`;
        }
        return selection.sourceName;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function visibleCities() {
        const q = normalize(state.search);
        const rows = data.cities.filter((city) => {
          const selected = state.selections[city.id];
          const skipped = state.skipped[city.id];
          const providerOk =
            state.provider === "all" ||
            city.candidates.some((candidate) =>
              Boolean(candidate.providers[state.provider]),
            ) ||
            (selected?.type === "source" &&
              Boolean(selected.providers?.[state.provider]));
          if (!providerOk) return false;
          const bestReviewScore = Math.max(
            city.bestScore,
            city.bestDbScore || 0,
          );
          if (bestReviewScore < state.minScore && !selected) return false;
          if (state.status === "open" && (selected || skipped)) return false;
          if (state.status === "selected" && !selected) return false;
          if (state.status === "skipped" && !skipped) return false;
          if (state.status === "strong" && bestReviewScore < 60) return false;
          if (state.status === "weak" && bestReviewScore >= 45) return false;
          if (!q) return true;
          const haystack = [
            city.name,
            city.province,
            ...(city.aliases || []),
            ...city.candidates.map((candidate) => candidate.sourceName),
            ...(city.dbCandidates || []).map((candidate) => candidate.name),
          ]
            .map(normalize)
            .join(" ");
          return haystack.includes(q);
        });

        rows.sort((a, b) => {
          if (state.sort === "name") return a.name.localeCompare(b.name);
          if (state.sort === "province")
            return (
              a.province.localeCompare(b.province) ||
              a.name.localeCompare(b.name)
            );
          if (state.sort === "selected") {
            return (
              Number(Boolean(state.selections[b.id])) -
                Number(Boolean(state.selections[a.id])) ||
              a.name.localeCompare(b.name)
            );
          }
          return (
            Math.max(b.bestScore, b.bestDbScore || 0) -
              Math.max(a.bestScore, a.bestDbScore || 0) ||
            a.name.localeCompare(b.name)
          );
        });
        return rows;
      }

      function render() {
        renderStats();
        renderRail();
        renderCities();
      }

      function renderStats() {
        const total = data.cities.length;
        const selected = Object.keys(state.selections).length;
        const skipped = Object.keys(state.skipped).length;
        els.totalCities.textContent = total;
        els.sourceCount.textContent = `${data.counts.shippingCandidates}/${data.counts.existingDbCities || data.dbTargets?.length || 0}`;
        els.selectedCount.textContent = selected;
        els.openCount.textContent = Math.max(0, total - selected - skipped);
        els.progressBar.style.width = `${Math.round(((selected + skipped) / total) * 100)}%`;
      }

      function renderRail() {
        const provinceMap = new Map();
        data.cities.forEach((city) =>
          provinceMap.set(
            city.province,
            (provinceMap.get(city.province) || 0) + 1,
          ),
        );
        els.provinceList.innerHTML = [...provinceMap.entries()]
          .sort((a, b) => b[1] - a[1])
          .map(
            ([province, count]) =>
              `<div class="province-pill"><span>${escapeHtml(province || "Unknown")}</span><strong>${count}</strong></div>`,
          )
          .join("");

        const recent = Object.values(state.selections).slice(-8).reverse();
        els.recentList.innerHTML =
          recent
            .map(
              (selection) =>
                `<div class="selected-pill"><span>${escapeHtml(selection.cityName)}</span><strong>${escapeHtml(selectionLabel(selection))}</strong></div>`,
            )
            .join("") ||
          `<div class="selected-pill"><span>No picks yet</span><strong>0</strong></div>`;
      }

      function renderCities() {
        const rows = visibleCities();
        els.resultCount.textContent = `${rows.length} visible`;
        if (!rows.length) {
          els.cityList.innerHTML = `<div class="empty">No cities match the current filters.</div>`;
          return;
        }
        els.cityList.innerHTML = rows.map(renderCityCard).join("");
      }

      function renderCityCard(city) {
        const selected = state.selections[city.id];
        const skipped = state.skipped[city.id];
        const className = `city-card${selected ? " is-selected" : ""}${selected?.type === "merge" ? " is-merge" : ""}${skipped ? " is-skipped" : ""}`;
        const candidateRows = city.candidates
          .slice(0, 5)
          .map((candidate) => renderCandidate(city, candidate, selected))
          .join("");
        const dbRows = (city.dbCandidates || [])
          .slice(0, 5)
          .map((candidate) => renderDbCandidate(city, candidate, selected))
          .join("");
        const bestReviewScore = Math.max(city.bestScore, city.bestDbScore || 0);
        return `
          <article class="${className}" id="city-${escapeHtml(city.id)}">
            <div class="city-head">
              <div>
                <h2 class="city-name">${escapeHtml(city.name)}</h2>
                <div class="city-id">${escapeHtml(city.id)} - ${escapeHtml(city.province || "Unknown")}${city.aliases?.length ? ` - aliases: ${escapeHtml(city.aliases.join(", "))}` : ""}</div>
              </div>
              <div class="score-badge">
                <strong>${bestReviewScore.toFixed(1)}</strong>
                <span>best</span>
              </div>
            </div>
            <div class="selected-strip">
              <span><strong>${escapeHtml(selectionLabel(selected))}</strong> ${selected ? `(${selected.score.toFixed(1)})` : ""}</span>
              <button class="btn quiet" type="button" data-action="clear" data-city="${escapeHtml(city.id)}">Clear</button>
            </div>
            <div class="section-label">
              <span>Courier sources</span>
              <button class="btn quiet" type="button" data-action="browse" data-mode="source" data-city="${escapeHtml(city.id)}">Browse all</button>
            </div>
            <div class="candidate-list">${candidateRows}</div>
            <div class="section-label">
              <span>Existing DB city</span>
              <button class="btn quiet" type="button" data-action="browse" data-mode="db" data-city="${escapeHtml(city.id)}">Browse DB</button>
            </div>
            <div class="candidate-list">${dbRows}</div>
            <div class="card-actions">
              <button class="btn quiet" type="button" data-action="skip" data-city="${escapeHtml(city.id)}">No match</button>
            </div>
          </article>
        `;
      }

      function renderCandidate(city, candidate, selected) {
        const picked =
          selected?.type !== "merge" && selected?.key === candidate.key;
        const tags = [
          ...candidate.tags,
          `lev ${candidate.levScore}`,
          `d ${candidate.distance}`,
        ].slice(0, 5);
        return `
          <div class="candidate${picked ? " is-picked" : ""}">
            <div class="candidate-main">
              <div class="candidate-title">
                <span>${escapeHtml(candidate.sourceName)}</span>
                <span class="chip">${escapeHtml(candidate.confidence)}</span>
              </div>
              <div class="chips">
                ${providerChips(candidate.providers)}
                ${tags.map((tag) => `<span class="chip">${escapeHtml(tag)}</span>`).join("")}
              </div>
              <div class="mini">${escapeHtml(providerText(candidate.providers))}</div>
            </div>
            <div class="candidate-score">
              <strong>${candidate.score.toFixed(1)}</strong>
              <div class="bar"><span style="width:${Math.max(4, Math.min(100, candidate.score))}%"></span></div>
              <span class="mini">match</span>
            </div>
            <button class="btn primary" type="button" data-action="pick" data-city="${escapeHtml(city.id)}" data-key="${escapeHtml(candidate.key)}">Pick</button>
          </div>
        `;
      }

      function renderDbCandidate(city, candidate, selected) {
        const picked =
          selected?.type === "merge" && selected?.targetId === candidate.id;
        const tags = [
          ...(candidate.tags || []),
          `lev ${candidate.levScore}`,
          `d ${candidate.distance}`,
        ].slice(0, 5);
        return `
          <div class="candidate db-target${picked ? " is-merge-picked" : ""}">
            <div class="candidate-main">
              <div class="candidate-title">
                <span>${escapeHtml(candidate.name)}</span>
                <span class="chip">${escapeHtml(candidate.confidence)}</span>
              </div>
              <div class="chips">
                ${dbTargetChips(candidate)}
                ${tags.map((tag) => `<span class="chip">${escapeHtml(tag)}</span>`).join("")}
              </div>
              <div class="mini">${escapeHtml(dbTargetText(candidate))}</div>
            </div>
            <div class="candidate-score">
              <strong>${candidate.score.toFixed(1)}</strong>
              <div class="bar"><span style="width:${Math.max(4, Math.min(100, candidate.score))}%"></span></div>
              <span class="mini">duplicate</span>
            </div>
            <button class="btn primary" type="button" data-action="merge" data-city="${escapeHtml(city.id)}" data-target="${escapeHtml(candidate.id)}">Merge</button>
          </div>
        `;
      }

      function chooseSource(cityId, candidate) {
        const city = data.cities.find((item) => item.id === cityId);
        state.selections[cityId] = {
          type: "source",
          cityId,
          cityName: city.name,
          sourceName: candidate.sourceName,
          key: candidate.key,
          score: candidate.score,
          confidence: candidate.confidence,
          providers: candidate.providers,
        };
        delete state.skipped[cityId];
        persist();
        render();
      }

      function chooseMerge(cityId, target) {
        const city = data.cities.find((item) => item.id === cityId);
        state.selections[cityId] = {
          type: "merge",
          cityId,
          cityName: city.name,
          targetId: target.id,
          targetName: target.name,
          targetProvince: target.province,
          score: target.score,
          confidence: target.confidence,
        };
        delete state.skipped[cityId];
        persist();
        render();
      }

      function skip(cityId) {
        delete state.selections[cityId];
        state.skipped[cityId] = true;
        persist();
        render();
      }

      function clearCity(cityId) {
        delete state.selections[cityId];
        delete state.skipped[cityId];
        persist();
        render();
      }

      function openDrawer(cityId, mode = "source") {
        state.drawerCityId = cityId;
        state.drawerMode = mode;
        state.drawerSearch = "";
        els.drawerSearch.value = "";
        els.drawerSearch.placeholder =
          mode === "db"
            ? "Search all existing DB cities"
            : "Search all remaining shipping cities";
        els.drawer.classList.add("is-open");
        els.drawer.setAttribute("aria-hidden", "false");
        renderDrawer();
        setTimeout(() => els.drawerSearch.focus(), 20);
      }

      function closeDrawer() {
        els.drawer.classList.remove("is-open");
        els.drawer.setAttribute("aria-hidden", "true");
        state.drawerCityId = null;
      }

      function renderDrawer() {
        const city = data.cities.find((item) => item.id === state.drawerCityId);
        if (!city) return;
        els.drawerCity.textContent =
          state.drawerMode === "db"
            ? `Merge ${city.name} into existing DB city`
            : city.name;
        els.drawerMeta.textContent = `${city.id} - ${city.province || "Unknown"}`;
        const q = normalize(state.drawerSearch);
        if (state.drawerMode === "db") {
          const scored = (data.dbTargets || [])
            .filter(
              (target) =>
                target.id !== city.id &&
                (!q ||
                  normalize(target.name).includes(q) ||
                  normalize(target.province).includes(q) ||
                  (target.aliases || []).some((alias) =>
                    normalize(alias).includes(q),
                  )),
            )
            .map((target) => scoreDbTarget(city, target))
            .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name))
            .slice(0, 100);
          els.drawerList.innerHTML = scored
            .map((candidate) =>
              renderDbCandidate(city, candidate, state.selections[city.id]),
            )
            .join("");
          return;
        }
        const scored = data.sources
          .filter(
            (source) =>
              !q ||
              normalize(source.sourceName).includes(q) ||
              providerText(source.providers).toLowerCase().includes(q),
          )
          .map((source) => scoreSource(city, source))
          .sort(
            (a, b) =>
              b.score - a.score || a.sourceName.localeCompare(b.sourceName),
          )
          .slice(0, 80);
        els.drawerList.innerHTML = scored
          .map((candidate) =>
            renderCandidate(city, candidate, state.selections[city.id]),
          )
          .join("");
      }

      function makeCsv() {
        return data.cities
          .map((city) => {
            const picked = state.selections[city.id];
            const source = picked?.type === "source" ? picked.sourceName : "";
            const conf = picked
              ? picked.type === "merge"
                ? "merge"
                : csvConfidence(picked.score)
              : "none";
            const existingDbCityId =
              picked?.type === "merge" ? picked.targetId : "";
            return [city.id, city.name, source, conf, existingDbCityId]
              .map(csvCell)
              .join(",");
          })
          .join("\n");
      }

      function csvCell(value) {
        const text = String(value ?? "");
        return /[",\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
      }

      async function copyCsv() {
        const csv = makeCsv();
        try {
          await navigator.clipboard.writeText(csv);
          showToast("CSV copied");
        } catch {
          els.csvOutput.value = csv;
          els.csvPanel.classList.add("is-open");
          els.csvOutput.select();
          document.execCommand("copy");
          showToast("CSV selected");
        }
      }

      function downloadCsv() {
        const blob = new Blob([makeCsv()], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "matches.csv";
        a.click();
        URL.revokeObjectURL(url);
      }

      function showToast(message) {
        els.toast.textContent = message;
        els.toast.classList.add("is-visible");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(
          () => els.toast.classList.remove("is-visible"),
          1500,
        );
      }

      els.searchInput.addEventListener("input", (event) => {
        state.search = event.target.value;
        renderCities();
      });
      els.statusFilter.addEventListener("change", (event) => {
        state.status = event.target.value;
        renderCities();
      });
      els.providerFilter.addEventListener("change", (event) => {
        state.provider = event.target.value;
        renderCities();
      });
      els.sortSelect.addEventListener("change", (event) => {
        state.sort = event.target.value;
        renderCities();
      });
      els.minScore.addEventListener("input", (event) => {
        state.minScore = Number(event.target.value);
        els.minScoreLabel.textContent = state.minScore;
        renderCities();
      });
      els.cityList.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const cityId = button.dataset.city;
        const action = button.dataset.action;
        const city = data.cities.find((item) => item.id === cityId);
        if (action === "pick") {
          chooseSource(
            cityId,
            city.candidates.find(
              (candidate) => candidate.key === button.dataset.key,
            ),
          );
        }
        if (action === "merge") {
          chooseMerge(
            cityId,
            city.dbCandidates.find(
              (candidate) => candidate.id === button.dataset.target,
            ),
          );
        }
        if (action === "browse") openDrawer(cityId, button.dataset.mode);
        if (action === "skip") skip(cityId);
        if (action === "clear") clearCity(cityId);
      });
      els.drawerList.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const city = data.cities.find(
          (item) => item.id === button.dataset.city,
        );
        if (button.dataset.action === "merge") {
          const target = data.dbTargets.find(
            (item) => item.id === button.dataset.target,
          );
          chooseMerge(city.id, scoreDbTarget(city, target));
          renderDrawer();
          return;
        }
        if (button.dataset.action !== "pick") return;
        const source = data.sources.find(
          (item) => item.key === button.dataset.key,
        );
        chooseSource(city.id, scoreSource(city, source));
        renderDrawer();
      });
      els.drawerSearch.addEventListener("input", (event) => {
        state.drawerSearch = event.target.value;
        renderDrawer();
      });
      els.closeDrawerBtn.addEventListener("click", closeDrawer);
      els.drawer.addEventListener("click", (event) => {
        if (event.target === els.drawer) closeDrawer();
      });
      els.resetBtn.addEventListener("click", () => {
        if (!confirm("Reset all saved picks?")) return;
        state.selections = {};
        state.skipped = {};
        persist();
        render();
      });
      els.showCsvBtn.addEventListener("click", () => {
        els.csvOutput.value = makeCsv();
        els.csvPanel.classList.add("is-open");
      });
      els.closeCsvBtn.addEventListener("click", () =>
        els.csvPanel.classList.remove("is-open"),
      );
      els.copyCsvBtn.addEventListener("click", copyCsv);
      els.downloadCsvBtn.addEventListener("click", downloadCsv);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeDrawer();
          els.csvPanel.classList.remove("is-open");
        }
      });

      if (!data) {
        document.body.innerHTML =
          "<main class='empty'>manual-match-data.js was not loaded.</main>";
      } else {
        loadSaved();
        render();
      }
    </script>
  </body>
</html>
